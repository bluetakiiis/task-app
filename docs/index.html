<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- LOGIN -->
    <div id="loginPage" class="login-page">
      <div class="login-container">
        <img class="login-image" src="images/login.jpg" alt="" />
        <div class="login-logo-container">
          <img class="login-logo-image" src="images/Main Logo.png" alt="" />
        </div>
        <div
          id="loginButton"
          class="login-button-container action-button"
          role="button"
          tabindex="0"
        >
          <div class="login-button-text">Get Started</div>
        </div>

        <div class="email-input-container">
          <div class="input-field-container">
            <input
              id="usernameInput"
              class="username-input-field"
              placeholder="Enter your username"
            />
          </div>
        </div>
        <div class="password-input-container">
          <div class="input-field-container">
            <input
              id="passwordInput"
              type="password"
              class="username-input-field"
              placeholder="Enter your password"
            />
          </div>
        </div>

        <div class="app-title">TaskFlow</div>
        <div class="input-label">Login</div>
      </div>
    </div>

    <!-- APP SIDEBAR -->
    <aside id="appSidebar" class="app-sidebar" aria-label="Main navigation">
      <nav class="main-navigation">
        <h4>
          <img src="images/Main Logo.png" class="app-logo" alt="" /><span
            >TaskFlow</span
          >
        </h4>

        <ul class="navigation-list">
          <li>
            <img class="nav-icon" src="images/Today Logo.png" alt="" /><a
              href="#"
              >Today</a
            >
          </li>
          <li>
            <img class="nav-icon" src="images/Upcoming Logo.png" alt="" /><a
              href="#"
              >Upcoming</a
            >
          </li>
          <li>
            <img class="nav-icon" src="images/Completed Logo.png" alt="" /><a
              href="#"
              >Completed</a
            >
          </li>
          <li>
            <img class="nav-icon" src="images/All Task Logo.png" alt="" /><a
              href="#"
              >All Tasks</a
            >
          </li>
        </ul>

        <div class="nav-divider"></div>

        <section>
          <h6 id="my-lists">MY LISTS</h6>
          <ul id="myListsNav" class="navigation-list">
            <li>
              <img class="nav-icon" src="images/Lists.png" alt="" /><a href="#"
                >Personal</a
              >
            </li>
            <li>
              <img class="nav-icon" src="images/Lists.png" alt="" /><a href="#"
                >Work</a
              >
            </li>
          </ul>
        </section>

        <div class="settings-container">
          <img src="images/Settings Logo.png" class="settings-icon" alt="" />
          <a href="#">Settings</a>
        </div>

        <div id="settingsPopup" class="popup-overlay">
          <div id="settingsModal" class="popup-content-container">
            <h3 class="modal-title settings-title">Settings</h3>
            <div class="settings-list">
              <button
                id="openAccounts"
                class="settings-row settings-link"
                type="button"
              >
                <span class="settings-label">Accounts</span>
              </button>
            </div>
          </div>
        </div>
      </nav>
    </aside>

    <!-- HEADER -->
    <header id="appHeader" class="app-header">
      <div id="greetingElement" class="user-greeting">Hello, User!</div>
      <div class="header-right">
        <div class="search-container">
          <img class="search-icon" src="images/Search Logo.png" alt="" />
          <input id="searchInput" class="search-field" placeholder="Search" />
        </div>

        <div class="user-container">
          <img
            id="userLogo"
            class="user-avatar"
            src="images/User Logo.png"
            alt="User"
          />
          <div id="userPopup" class="popup-overlay">
            <div class="popup-content-container">
              <div class="popup-avatar-container">
                <img class="popup-avatar" src="images/User Logo.png" alt="" />
              </div>
              <h1 id="userNameDisplay" class="popup-username">User Name</h1>
              <p class="task-status">
                Tasks Completed: <span class="task-count">2</span>
              </p>
              <p class="task-status">
                Tasks Pending: <span class="task-count">2</span>
              </p>
              <div class="action-buttons">
                <button id="logoutButton" class="action-button logout-button">
                  Logout
                </button>
                <button
                  id="deleteAccountBtn"
                  class="action-button delete-button"
                >
                  Delete Acc
                </button>
              </div>
              <div class="popup-overlay delete-popup">
                <div class="popup-content-container">
                  <div class="popup-avatar-container">
                    <img
                      class="popup-avatar"
                      src="images/Delete Logo.png"
                      alt=""
                    />
                  </div>
                  <h1 class="popup-username delete-title">Delete Account</h1>
                  <p class="task-status delete-message">
                    Are you sure you want to delete your account?
                  </p>
                  <div class="action-buttons">
                    <button
                      id="deleteConfirmBtn"
                      class="action-button delete-confirm-btn"
                    >
                      Yes, Delete
                    </button>
                    <button
                      id="deleteCancelBtn"
                      class="action-button delete-cancel-btn"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="appContent" class="app-content">
      <div class="task-header">
        <span>Today's Task</span>
        <div id="priorityFilter" class="filter-wrapper">
          <svg
            class="filter-icon"
            viewBox="0 0 20 20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M2 4h16l-6 7v5l-4-2v-3L2 4z" />
          </svg>
          <div id="priorityFilterMenu" class="filter-menu">
            <label class="filter-option"
              ><input
                class="priority-checkbox"
                type="checkbox"
                value="High"
                checked
              />High</label
            >
            <label class="filter-option"
              ><input
                class="priority-checkbox"
                type="checkbox"
                value="Medium"
                checked
              />Medium</label
            >
            <label class="filter-option"
              ><input
                class="priority-checkbox"
                type="checkbox"
                value="Low"
                checked
              />Low</label
            >
          </div>
        </div>
      </div>

      <div id="tasksContainer" class="tasks-container"></div>
    </main>

    <!-- FOOTER + MODALS -->
    <footer id="appFooter" class="app-footer">
      <div class="footer-left">
        <img class="task-icon" src="images/New Task Logo.png" alt="" />
        <button class="new-task-button">New Task</button>
      </div>

      <div id="newTaskModalOverlay" class="popup-overlay">
        <div
          id="newTaskModal"
          class="popup-content-container task-popup-container"
        >
          <div class="task-header">
            <button class="add-task-btn">Add Task</button>
            <input class="task-title-input" placeholder="Add a new task..." />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="due-date">Due Date</label>
              <div class="input-with-icon">
                <input id="due-date" type="date" />
                <span class="calendar-icon"></span>
              </div>
            </div>
            <div class="field">
              <label>Category</label>
              <select id="taskCategorySelect">
                <option>Work</option>
                <option>Personal</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="time">Time</label>
              <div class="input-with-icon">
                <input id="time" type="time" />
                <span class="clock-icon"></span>
              </div>
            </div>
            <div class="field">
              <label>Priority</label
              ><select id="taskPrioritySelect">
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>Description</label
            ><textarea
              id="taskDescription"
              placeholder="Add details..."
            ></textarea>
          </div>
        </div>
      </div>

      <div id="viewTaskModalOverlay" class="popup-overlay">
        <div
          id="viewTaskModal"
          class="popup-content-container view-task-container"
        ></div>
      </div>
      <div id="editTaskModalOverlay" class="popup-overlay">
        <div
          id="editTaskModal"
          class="popup-content-container edit-task-container"
        ></div>
      </div>
      <div id="deleteTaskModalOverlay" class="popup-overlay">
        <div
          id="deleteTaskModal"
          class="popup-content-container delete-task-container"
        ></div>
      </div>

      <div class="footer-right">
        <button class="add-task-button">Add List</button>
      </div>

      <div id="addListModalOverlay" class="popup-overlay">
        <div
          id="addListModal"
          class="popup-content-container list-popup-container"
        >
          <h3 class="modal-title">Add List</h3>
          <div class="field">
            <label for="new-list-name">Name</label>
            <div class="add-list-row">
              <input
                id="new-list-name"
                type="text"
                placeholder="Name a new list..."
              />
              <button id="confirmAddListBtn" class="add-task-btn">
                Add List
              </button>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script src="javascript/script.js"></script>
  </body>
</html>
